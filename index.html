    <script>
        // 🔑 Set your exact Render Backend URL here:
        const BACKEND_URL = "https://abdullah-ai-backend.onrender.com";

        async function updateDashboard() {
            try {
                const response = await fetch(`${BACKEND_URL}/dashboard`);
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                
                const data = await response.json();

                document.getElementById('connection-status').innerText = "Connected & Working 🟢";
                document.getElementById('connection-status').style.color = "#10b981";

                document.getElementById('global-tokens').innerText = (data.combined_tokens_used || 0).toLocaleString();
                document.getElementById('global-remaining').innerText = (data.combined_tokens_remaining || 0).toLocaleString();
                document.getElementById('working-count').innerText = data.connected_apis || 0;

                const apiList = document.getElementById('api-list');
                const apiSelect = document.getElementById('apiSelect');
                
                const currentSelection = apiSelect.value;
                apiSelect.innerHTML = `<option value="auto">⚡ Auto-Switch / Failover Mode (Recommended)</option>`;
                apiList.innerHTML = '';

                if (data.api_breakdown && Array.isArray(data.api_breakdown)) {
                    data.api_breakdown.forEach(api => {
                        apiSelect.innerHTML += `<option value="${api.id}">Force Route: ${api.id} (${api.provider})</option>`;

                        let color = "#ef4444"; 
                        if (api.status === "Connected & Active") color = "#10b981"; 
                        if (api.status === "Awaiting API Key") color = "#64748b"; 
                        if (api.status === "Rate Limited") color = "#f59e0b";

                        apiList.innerHTML += `
                            <div class="api-item" style="border-left-color: ${color};">
                                <div>
                                    <strong>${api.id}</strong> <span style="color: #3b82f6; font-size: 0.8rem;">[${api.provider}]</span>
                                    <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 3px;">
                                        Tokens Used: ${api.tokens_used.toLocaleString()} | Remaining: ${api.remaining.toLocaleString()}
                                    </div>
                                </div>
                                <div style="color: ${color}; font-weight: bold; font-size: 0.85rem;">
                                    ${api.status}
                                </div>
                            </div>
                        `;
                    });
                }

                apiSelect.value = currentSelection;

            } catch (err) {
                console.error("Dashboard Fetch Error:", err);
                document.getElementById('connection-status').innerText = "Disconnected 🔴";
                document.getElementById('connection-status').style.color = "#ef4444";
                document.getElementById('api-list').innerHTML = `<p style="text-align: center; color: #ef4444; margin: 10px 0;">Backend Network Error. Is Render awake?</p>`;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatbox = document.getElementById('chatbox');
            const apiSelect = document.getElementById('apiSelect');
            const text = input.value.trim();
            if (!text) return;

            // Render Sana's message
            chatbox.innerHTML += `<div class="msg sana">${escapeHtml(text)}</div>`;
            input.value = '';
            chatbox.scrollTop = chatbox.scrollHeight;

            input.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        selected_api: apiSelect.value 
                    })
                });
                
                const data = await response.json();

                if (response.ok) {
                    chatbox.innerHTML += `
                        <div class="msg abdullah">
                            ${escapeHtml(data.reply || "No response received.")}
                            <div style="font-size: 0.7rem; color: #94a3b8; margin-top: 5px; text-align: right;">
                                ⚡ Routed via ${data.provider || "Auto Engine"}
                            </div>
                        </div>`;
                } else {
                    chatbox.innerHTML += `<div class="msg abdullah" style="color:#ef4444;">⚠️ Error: ${escapeHtml(data.detail || "Server error")}</div>`;
                }

                chatbox.scrollTop = chatbox.scrollHeight;

                // Refresh Metrics
                updateDashboard();

            } catch (error) {
                chatbox.innerHTML += `<div class="msg abdullah" style="color:#ef4444;">⚠️ Network Error sending message.</div>`;
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.onload = updateDashboard;
    </script>
